services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: modulus
      POSTGRES_DB: modulus
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
volumes:
  pgdata: